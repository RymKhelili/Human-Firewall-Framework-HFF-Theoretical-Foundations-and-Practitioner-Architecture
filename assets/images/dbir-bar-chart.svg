<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>
  <text x="350" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Simulated vs. Real Phishing: Click Rates</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#64748b">Verizon 2021 Data Breach Investigations Report · n ≈ 1,100 employees</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="610" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="330" stroke="#334155" stroke-width="2"/>

  <!-- gridlines -->
  <line x1="90" y1="270" x2="610" y2="270" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="210" x2="610" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="150" x2="610" y2="150" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="334" text-anchor="end" font-size="11" fill="#64748b">0%</text>
  <text x="80" y="274" text-anchor="end" font-size="11" fill="#64748b">1%</text>
  <text x="80" y="214" text-anchor="end" font-size="11" fill="#64748b">2%</text>
  <text x="80" y="154" text-anchor="end" font-size="11" fill="#64748b">3%</text>

  <!-- bar: simulated phish, 0% -->
  <rect x="200" y="329" width="120" height="1" fill="#0284c7"/>
  <text x="260" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">0%</text>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#334155">Simulated phishing</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#64748b">(employees knew it might be a test)</text>

  <!-- bar: real phish, 2.5% -->
  <rect x="380" y="180" width="120" height="150" fill="#dc2626"/>
  <text x="440" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2.5%</text>
  <text x="440" y="350" text-anchor="middle" font-size="0"></text>
  <text x="440" y="368" text-anchor="middle" font-size="12" fill="#334155">Real phishing</text>
  <text x="440" y="384" text-anchor="middle" font-size="11" fill="#64748b">(unannounced, real conditions)</text>

  <text x="350" y="410" text-anchor="middle" font-size="12" font-style="italic" fill="#0f172a">Simulations don't predict how people react to a genuine attack.</text>
</svg>
