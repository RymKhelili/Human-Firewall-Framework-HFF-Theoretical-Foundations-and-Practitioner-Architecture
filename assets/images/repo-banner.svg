<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- decorative shield/firewall motif -->
  <g opacity="0.15">
    <path d="M 950 40 L 1050 40 L 1050 140 Q 1050 200 1000 230 Q 950 200 950 140 Z" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 970 60 L 1030 60 L 1030 135 Q 1030 175 1000 200 Q 970 175 970 135 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <text x="70" y="120" font-family="Georgia, serif" font-size="52" fill="#f8fafc" font-weight="600">The Human Firewall Framework</text>
  <text x="70" y="165" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Defending human cognition with the same rigor attackers use to exploit it</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#38bdf8">
    <rect x="70" y="200" width="150" height="34" rx="17" fill="#0c4a6e"/>
    <text x="95" y="222">Part I: Theory</text>

    <rect x="235" y="200" width="180" height="34" rx="17" fill="#0c4a6e"/>
    <text x="260" y="222">Part II: Framework</text>
  </g>
</svg>
