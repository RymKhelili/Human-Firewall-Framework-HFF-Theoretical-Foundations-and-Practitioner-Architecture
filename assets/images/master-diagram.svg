<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">From Research to Practice</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#64748b">Part I's seven research areas feeding Part II's four practitioner functions</text>

  <!-- Part I column -->
  <text x="200" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">PART I — Theoretical Foundations</text>
  <g font-size="11.5" fill="#334155">
    <rect x="60" y="105" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="125" text-anchor="middle">Weakest-link critique</text>

    <rect x="60" y="145" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="165" text-anchor="middle">Training-efficacy trials</text>

    <rect x="60" y="185" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="205" text-anchor="middle">Cognitive Security (CogSec)</text>

    <rect x="60" y="225" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="245" text-anchor="middle">Dual-process theory</text>

    <rect x="60" y="265" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="285" text-anchor="middle">Persuasion science</text>

    <rect x="60" y="305" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="325" text-anchor="middle">Memory neuroscience</text>

    <rect x="60" y="345" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="365" text-anchor="middle">Inoculation theory</text>

    <rect x="60" y="385" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="405" text-anchor="middle">Behavior change (COM-B)</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#94a3b8" stroke-width="1.3" fill="none" opacity="0.7">
    <path d="M340,120 C 480,120 480,150 620,150"/>
    <path d="M340,160 C 480,160 480,150 620,150"/>
    <path d="M340,200 C 480,200 480,220 620,270"/>
    <path d="M340,240 C 480,240 480,220 620,270"/>
    <path d="M340,280 C 480,280 480,390 620,390"/>
    <path d="M340,320 C 480,320 480,390 620,390"/>
    <path d="M340,360 C 480,360 480,390 620,390"/>
    <path d="M340,400 C 480,400 480,510 620,510"/>
  </g>

  <!-- Part II column -->
  <text x="800" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">PART II — HFF Functions</text>

  <rect x="620" y="120" width="290" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">1. Removing the Blame</text>
  <text x="765" y="163" text-anchor="middle" font-size="10.5" fill="#7f1d1d">from weakest-link + training-efficacy critique</text>

  <rect x="620" y="240" width="290" height="60" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="765" y="265" text-anchor="middle" font-size="12.5" font-weight="700" fill="#075985">2. Teaching the Mechanism</text>
  <text x="765" y="283" text-anchor="middle" font-size="10.5" fill="#0c4a6e">from CogSec + dual-process + persuasion science</text>

  <rect x="620" y="360" width="290" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="765" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">3. Building Resistance</text>
  <text x="765" y="403" text-anchor="middle" font-size="10.5" fill="#14532d">from persuasion science + inoculation theory</text>

  <rect x="620" y="480" width="290" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="765" y="505" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">4. Designing for Retention</text>
  <text x="765" y="523" text-anchor="middle" font-size="10.5" fill="#713f12">from memory neuroscience + COM-B</text>

  <text x="500" y="580" text-anchor="middle" font-size="12" font-style="italic" fill="#0f172a">Every function traces back to a cited body of research — see Part I for sources.</text>
</svg>
