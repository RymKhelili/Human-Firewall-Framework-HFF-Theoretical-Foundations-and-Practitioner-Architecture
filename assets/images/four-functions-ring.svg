<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="700" fill="#ffffff"/>
  <text x="350" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">The Human Firewall Framework — Four Concurrent Functions</text>
  <text x="350" y="62" text-anchor="middle" font-size="12" fill="#64748b">Present simultaneously, not completed in sequence</text>

  <!-- center hub -->
  <circle cx="350" cy="360" r="90" fill="#0f172a"/>
  <text x="350" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Human</text>
  <text x="350" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Firewall</text>

  <!-- connecting ring -->
  <circle cx="350" cy="360" r="220" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Function 1: top -->
  <circle cx="350" cy="140" r="95" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">1. Remove the Blame</text>
  <text x="350" y="150" text-anchor="middle" font-size="10.5" fill="#7f1d1d">No-blame culture,</text>
  <text x="350" y="165" text-anchor="middle" font-size="10.5" fill="#7f1d1d">honest reporting</text>

  <!-- Function 2: right -->
  <circle cx="570" cy="360" r="95" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
  <text x="570" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">2. Teach the</text>
  <text x="570" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">Mechanism</text>
  <text x="570" y="386" text-anchor="middle" font-size="10.5" fill="#0c4a6e">Name the lever,</text>
  <text x="570" y="400" text-anchor="middle" font-size="10.5" fill="#0c4a6e">not the checklist</text>

  <!-- Function 3: bottom -->
  <circle cx="350" cy="580" r="95" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">3. Build Resistance</text>
  <text x="350" y="588" text-anchor="middle" font-size="10.5" fill="#14532d">Controlled exposure</text>
  <text x="350" y="602" text-anchor="middle" font-size="10.5" fill="#14532d">+ explicit rebuttal</text>

  <!-- Function 4: left -->
  <circle cx="130" cy="360" r="95" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="130" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">4. Design for</text>
  <text x="130" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">Retention</text>
  <text x="130" y="386" text-anchor="middle" font-size="10.5" fill="#713f12">Emotional engagement,</text>
  <text x="130" y="400" text-anchor="middle" font-size="10.5" fill="#713f12">not flat facts</text>

  <!-- connecting arrows around ring -->
  <path d="M 415 165 A 220 220 0 0 1 535 285" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 545 435 A 220 220 0 0 1 425 555" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 285 555 A 220 220 0 0 1 165 435" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 155 285 A 220 220 0 0 1 285 165" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
